# Deployment compose for the published image.
# Pulls phungvanquy/relay-manager from Docker Hub — no source checkout needed.
#   1. cp .env.example .env  &&  edit the values
#   2. docker compose pull
#   3. docker compose up -d
#
# Agent binaries are baked into the image at /app/releases, so no bind-mount
# is required. Only the SQLite data volume is persisted across restarts.
services:
  dashboard:
    image: phungvanquy/relay-manager:latest
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - DASHBOARD_URL=${DASHBOARD_URL}
      - PORT=${PORT:-4000}
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    volumes:
      - dashboard_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:${PORT:-4000}/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  dashboard_data:
