services:
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - DASHBOARD_URL=${DASHBOARD_URL}
      - PORT=3000
    volumes:
      - dashboard_data:/app/data
      - ./releases:/app/releases:ro
    networks:
      - internal
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${CERT_PATH}/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      - ${CERT_PATH}/privkey.pem:/etc/nginx/certs/privkey.pem:ro
    networks:
      - internal
    depends_on:
      dashboard:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dashboard_data:

networks:
  internal:
