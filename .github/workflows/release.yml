name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: agent/go.sum

      - run: npm ci
        working-directory: dashboard
      - run: npm run lint && npx tsc --noEmit && npm test && npm run build
        working-directory: dashboard
      - run: npm audit --omit=dev --audit-level=high
        working-directory: dashboard
      - run: go test -race ./...
        working-directory: agent

  release:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: agent/go.sum

      # Build agent binaries for all platforms and create .tar.gz archives
      - name: Build agent binaries
        run: |
          make -C agent release
          mkdir -p releases
          cp agent/bin/relay-agent-linux-amd64 agent/bin/relay-agent-linux-arm64 releases/
          cd releases
          sha256sum relay-agent-linux-amd64 > relay-agent-linux-amd64.sha256
          sha256sum relay-agent-linux-arm64 > relay-agent-linux-arm64.sha256
          sha256sum ../agent/bin/relay-agent-linux-amd64.tar.gz | sed 's#../agent/bin/##' > relay-agent-linux-amd64.tar.gz.sha256
          sha256sum ../agent/bin/relay-agent-linux-arm64.tar.gz | sed 's#../agent/bin/##' > relay-agent-linux-arm64.tar.gz.sha256
        env:
          VERSION: ${{ github.ref_name }}

      # Enable cross-arch builds (arm64 runs under QEMU emulation on the amd64 runner)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Build and push multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dashboard/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Create GitHub Release and attach agent archives
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            agent/bin/relay-agent-linux-amd64.tar.gz
            agent/bin/relay-agent-linux-arm64.tar.gz
            releases/relay-agent-linux-amd64
            releases/relay-agent-linux-arm64
            releases/relay-agent-linux-amd64.sha256
            releases/relay-agent-linux-arm64.sha256
            releases/relay-agent-linux-amd64.tar.gz.sha256
            releases/relay-agent-linux-arm64.tar.gz.sha256
          generate_release_notes: true
